server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Food images are uploaded through this proxy - allow a generous body size.
    client_max_body_size 25m;

    # Report exports / ML analysis can take a while.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy: the frontend is built with VITE_API_URL=/api, so every
    # API call goes to this origin and is forwarded to the Docker service
    # "backend" (NOT localhost). The trailing slash on proxy_pass strips the
    # /api prefix: /api/auth/login -> http://backend:8000/auth/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
