<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Food Freshness Monitoring Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon">🌱</div>
          <div style="text-align: left;">
            <div style="font-weight: 800; font-size: 19px; color: var(--text-main);">FreshGuard</div>
            <div style="font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase;">Food Intelligence</div>
          </div>
        </a>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join the intelligent food freshness monitoring network</p>
      </div>

      <!-- Error / Feedback Alert -->
      <div id="auth-alert" class="auth-alert"></div>

      <!-- Registration Form -->
      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name / Organization</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="e.g. Sarah Jenkins or Fresh Market"
            required
            minlength="2"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="role" class="form-label">Platform Role</label>
          <select id="role" class="form-control" required>
            <option value="Consumer" selected>Consumer (Personal & Household)</option>
            <option value="Retailer">Retailer (Grocery Store / Supermarket)</option>
            <option value="Warehouse Manager">Warehouse Manager (Cold Storage & Depots)</option>
            <option value="Food Manufacturer">Food Manufacturer (Processing & Packaging)</option>
            <option value="Supply Chain Operator">Supply Chain Operator (Logistics & Fleet)</option>
            <option value="Food Quality Inspector">Food Quality Inspector (QA / QC Compliance)</option>
            <option value="Admin">Administrator (System & Platform Governance)</option>
          </select>
          <div class="form-text">
            Select your role to access your dedicated workspace and role-specific dashboard.
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="At least 6 chars"
              required
              minlength="6"
            >
          </div>

          <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="confirm_password"
              class="form-control"
              placeholder="Re-enter password"
              required
            >
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary auth-submit-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign In Here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
