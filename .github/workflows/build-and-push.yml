name: Build and Push Docker Images to Azure Container Registry

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: freshsenseacr2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME || 'freshsenseacr2026' }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            freshsenseacr2026.azurecr.io/freshsense-backend:latest
            freshsenseacr2026.azurecr.io/freshsense-backend:v2
            freshsenseacr2026.azurecr.io/freshsense-backend:v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            freshsenseacr2026.azurecr.io/freshsense-frontend:latest
            freshsenseacr2026.azurecr.io/freshsense-frontend:v2
            freshsenseacr2026.azurecr.io/freshsense-frontend:v3
