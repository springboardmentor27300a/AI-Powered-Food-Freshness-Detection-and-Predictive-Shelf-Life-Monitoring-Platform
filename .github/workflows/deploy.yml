name: CI/CD — Test & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Run Tests
  # ══════════════════════════════════════════════════════════════
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: food-freshness-backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run test suite
        working-directory: food-freshness-backend
        env:
          DATABASE_URL: sqlite:///./test_freshness.db
        run: |
          python -m pytest test_main.py -v --tb=short

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Deploy to EC2 (only on push to main, after tests pass)
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test                    # Only deploy if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            cd /home/ubuntu/food-freshness-monitoring-platform

            echo "Pulling latest code..."
            git pull origin main

            echo "Rebuilding and restarting services..."
            docker compose down
            docker compose up -d --build

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deployment complete! Services running:"
            docker compose ps
