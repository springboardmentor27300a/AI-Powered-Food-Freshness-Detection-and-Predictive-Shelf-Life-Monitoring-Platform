<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FreshAI — Dashboard</title>
<meta name="theme-color" content="#07120e" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <a href="index.html" class="logo"><i></i>Fresh<b>AI</b></a>
    <nav id="nav"></nav>
    <div class="side-foot"><div class="me" id="me"></div><button class="link" id="logout" type="button">Sign out</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon burger" id="burger" type="button" aria-label="Menu">☰</button>
      <div class="search"><span>🔍</span><input id="gsearch" type="search" placeholder="Search inventory…" aria-label="Search inventory" /></div>
      <div class="top-r">
        <span class="live" title="Live sensor simulation"><i></i>Live</span>
        <div class="bellwrap"><button class="icon" id="bell" type="button" aria-label="Notifications">🔔<em id="bellN" hidden>0</em></button><div class="drop" id="bellDrop" hidden></div></div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toasts" id="toasts"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
