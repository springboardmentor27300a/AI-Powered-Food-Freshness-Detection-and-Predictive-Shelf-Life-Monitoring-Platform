services:
  food-freshness-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_freshness_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/food_freshness_db}
      - DATABASE_NAME=${DATABASE_NAME:-food_freshness_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_food_freshness_2026_secure_key_min32}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - ADMIN_DEFAULT_EMAIL=admin@foodfreshness.com
      - ADMIN_DEFAULT_PASSWORD=AdminPassword123!
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7.0
    container_name: food_freshness_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_uploads:
  mongo_data:
