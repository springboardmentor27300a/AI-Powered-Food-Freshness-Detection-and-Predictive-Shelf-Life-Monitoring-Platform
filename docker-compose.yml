version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: freshness_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: freshness_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./food-freshness-backend
      dockerfile: Dockerfile
    container_name: freshness_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/freshness_db
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./food-freshness-frontend
      dockerfile: Dockerfile
    container_name: freshness_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
