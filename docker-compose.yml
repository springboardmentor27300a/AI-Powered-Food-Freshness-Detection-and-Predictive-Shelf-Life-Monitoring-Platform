# Food Freshness Monitoring Platform - full local stack
#
#   docker compose up --build
#   Frontend:  http://localhost:3000
#   API:       http://localhost:8000/api/health
#
# Environment: create a .env file next to this file (see .env.example).
# Do NOT put real secrets in this file.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: ${MONGO_URL:?Set MONGO_URL in root .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    # The Dockerfile also defines a HEALTHCHECK (start_period 90s covers TF model load)

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
  uploads_data:
