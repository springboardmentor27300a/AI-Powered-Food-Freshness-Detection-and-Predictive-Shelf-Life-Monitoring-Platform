version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freshsense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jahnavi}
      POSTGRES_DB: ${DB_NAME:-freshsense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshsense_backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-jahnavi}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-freshsense}
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-jahnavi}@db:5432/${DB_NAME:-freshsense}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshsense_frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      - backend

volumes:
  postgres_data:
